name: order-tracker

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - orders:/data
    depends_on:
      - otel-collector
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - incident-response
    restart: unless-stopped

  incident-response:
    build:
      context: .
      dockerfile: incident-response/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      INCIDENT_DATA_DIR: /data
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      INCIDENT_ASSISTANT_ENABLED: ${INCIDENT_ASSISTANT_ENABLED:-true}
    volumes:
      - incidents:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  incident-worker:
    build:
      context: .
      dockerfile: incident-response/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "worker.py"]
    environment:
      INCIDENT_DATA_DIR: /data
      INCIDENT_WORKSPACE_DIR: ${PWD}
      INCIDENT_WORKTREES_DIR: ${PWD}/.incident-worktrees
      ORDER_DB_PATH: /orders/orders.db
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-sonnet}
      CLAUDE_CODE_COMMAND: claude
    volumes:
      - incidents:/data
      - orders:/orders:ro
      # Same absolute path as the host, so worktree links work in host git too.
      - .:${PWD}
    depends_on:
      - incident-response
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/incident-worker.heartbeat') > 1100)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  orders:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  incidents:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
